# The oldest path still supported: MBR, BIOS boot, openrc, ext4, no overlay.
config_version = 1

[system]
hostname = "plain"
timezone = "UTC"
locales = ["en_US.UTF-8"]
locale = "en_US.UTF-8"
init = "openrc"
root_password_hash = "$6$rounds=656000$fixedsaltforthetest$1"

[portage]
profile = "default/linux/amd64/23.0"
makeopts = "-j4"

[portage.binhost]
official = false
community = "off"

[kernel]
source = "dist-bin"

[bootloader]
kind = "grub"
firmware = "bios"

[disk]
root = "mnt-root"

[[disk.devices]]
kind = "existing"
id = "disk"
selector = "/dev/disk/by-id/virtio-target"
wipe = true

[[disk.devices]]
kind = "table"
id = "table"
disk = "disk"
table = "mbr"

[[disk.devices]]
kind = "partition"
id = "swappart"
table = "table"
index = 1
role = "swap"
size = "2GiB"

[[disk.devices]]
kind = "partition"
id = "rootpart"
table = "table"
index = 2
role = "data"

[[disk.devices]]
kind = "swap"
id = "swap"
device = "swappart"

[[disk.devices]]
kind = "filesystem"
id = "rootfs"
device = "rootpart"
type = "ext4"
label = "root"

[[disk.devices]]
kind = "mountpoint"
id = "mnt-root"
source = "rootfs"
path = "/"
