# LUKS2 under btrfs with subvolumes, which is the layout the Live ISO's
# Calamares configuration produces. The passphrase is read from the file named
# below; an operator writes it there before an unattended install.
config_version = 1

[system]
hostname = "cryptbox"
timezone = "Asia/Taipei"
locales = ["en_US.UTF-8", "zh_TW.UTF-8"]
locale = "zh_TW.UTF-8"
init = "systemd"
root_password_hash = "$6$gentooinst$IR3GrdJ862XljQYDqocr4tKniIRDIT.jQNFzIrHE3U75H6B6YSWZoSYoVd5edSHpqaYBdiNfXHCoIPRVgb9lT/"

[portage]
profile = "default/linux/amd64/23.0/systemd"
makeopts = "-j4"

[portage.binhost]
official = true
community = "off"

[kernel]
source = "dist-bin"

[bootloader]
kind = "grub"
firmware = "uefi"
kernel_params = ["console=ttyS0,115200"]

[disk]
root = "mnt-root"

[[disk.devices]]
kind = "existing"
id = "disk"
selector = "/dev/disk/by-id/virtio-target0"
wipe = true

[[disk.devices]]
kind = "table"
id = "table"
disk = "disk"
table = "gpt"

[[disk.devices]]
kind = "partition"
id = "esp"
table = "table"
index = 1
role = "esp"
size = "512MiB"

[[disk.devices]]
kind = "partition"
id = "cryptroot"
table = "table"
index = 2
role = "data"

[[disk.devices]]
kind = "filesystem"
id = "espfs"
device = "esp"
type = "vfat"
label = "ESP"

[[disk.devices]]
kind = "luks"
id = "root-luks"
backing = "cryptroot"
name = "root"
passphrase_file = "/run/gentoo-install-keys/root"

[[disk.devices]]
kind = "filesystem"
id = "rootfs"
device = "root-luks"
type = "btrfs"

[[disk.devices]]
kind = "subvolume"
id = "sub-root"
filesystem = "rootfs"
name = "@"

[[disk.devices]]
kind = "subvolume"
id = "sub-home"
filesystem = "rootfs"
name = "@home"

[[disk.devices]]
kind = "mountpoint"
id = "mnt-root"
source = "sub-root"
path = "/"
options = ["compress=zstd:1"]

[[disk.devices]]
kind = "mountpoint"
id = "mnt-home"
source = "sub-home"
path = "/home"
options = ["compress=zstd:1"]

[[disk.devices]]
kind = "mountpoint"
id = "mnt-esp"
source = "espfs"
path = "/efi"
options = ["umask=0077"]
