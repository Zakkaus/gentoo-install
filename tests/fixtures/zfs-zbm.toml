# ZFS root with ZFSBootMenu: the kernel stays in the pool, the esp holds only
# the ZBM executable. UEFI only, no GRUB.
config_version = 1

[system]
hostname = "zfsbox"
timezone = "Asia/Taipei"
locales = ["en_US.UTF-8", "zh_TW.UTF-8"]
locale = "zh_TW.UTF-8"
init = "systemd"
console_cjk = true
console_font = "8x16"

[[system.users]]
name = "zakk"
sudo = true
password_hash = "$6$rounds=656000$fixedsaltforthetest$0"

[portage]
profile = "default/linux/amd64/23.0/systemd"
makeopts = "-j8"

[portage.mirrors]
region = "global"

[portage.binhost]
official = true
community = "off"

[[portage.overlays]]
name = "gentoo-zh"
sync_uri = "https://github.com/gentoo-zh/overlay.git"

[kernel]
# The only fixture that builds the cjk kernel rather than taking the
# prebuilt one. `cjk-bin` is what the Chinese interface defaults to and
# what the other two use, so this is the one run that covers the source
# path at all.
source = "cjk-bin"

[bootloader]
kind = "zfsbootmenu"
firmware = "uefi"
kernel_params = ["console=ttyS0,115200", "quiet"]

[packages]
desktop = "console"

[disk]
root = "mnt-root"

[[disk.devices]]
kind = "existing"
id = "disk"
selector = "/dev/disk/by-id/virtio-target0"
wipe = true

[[disk.devices]]
kind = "table"
id = "table"
disk = "disk"
table = "gpt"

[[disk.devices]]
kind = "partition"
id = "esp"
table = "table"
index = 1
role = "esp"
size = "512MiB"

[[disk.devices]]
kind = "partition"
id = "poolpart"
table = "table"
index = 2
role = "data"

[[disk.devices]]
kind = "filesystem"
id = "espfs"
device = "esp"
type = "vfat"
label = "ESP"

[[disk.devices]]
kind = "zpool"
id = "pool"
vdevs = ["poolpart"]
name = "zpcala"
encrypted = true
passphrase_file = "/run/gentoo-install-keys/pool"

[[disk.devices]]
kind = "dataset"
id = "ds-root"
pool = "pool"
name = "ROOT/gentoo/root"

[[disk.devices]]
kind = "dataset"
id = "ds-home"
pool = "pool"
name = "ROOT/gentoo/home"

[[disk.devices]]
kind = "mountpoint"
id = "mnt-root"
source = "ds-root"
path = "/"

[[disk.devices]]
kind = "mountpoint"
id = "mnt-home"
source = "ds-home"
path = "/home"

[[disk.devices]]
kind = "mountpoint"
id = "mnt-esp"
source = "espfs"
path = "/efi"
options = ["umask=0077"]
