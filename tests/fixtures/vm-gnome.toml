# GNOME and gdm. The other desktop fixtures are Plasma, so the gnome profile,
# gdm's own seat flag and its systemd unit name were never installed once.
#
# The root hash below is `install`, produced by `openssl passwd -6`. It has to
# be a real hash: a made-up one is accepted by `usermod --password` and only
# shows up as a system nobody can log into.
config_version = 1

[system]
hostname = "gnomebox"
timezone = "UTC"
locales = ["en_US.UTF-8"]
locale = "en_US.UTF-8"
init = "systemd"
# The desktop brings NetworkManager, so the init's own manager stays off:
# both claim every interface and the address is whichever won the race.
networking = "networkmanager-wpa"
sshd = true
root_password_hash = "$6$gentooinst$IR3GrdJ862XljQYDqocr4tKniIRDIT.jQNFzIrHE3U75H6B6YSWZoSYoVd5edSHpqaYBdiNfXHCoIPRVgb9lT/"

[portage]
profile = "default/linux/amd64/23.0/desktop/gnome/systemd"
makeopts = "-j4"

[portage.mirrors]
region = "global"

[portage.binhost]
official = true
community = "off"

[kernel]
source = "dist-bin"

[bootloader]
kind = "grub"
firmware = "uefi"
kernel_params = ["console=ttyS0,115200"]

[disk]
root = "mnt-root"

[[disk.devices]]
kind = "existing"
id = "disk"
selector = "/dev/disk/by-id/virtio-target0"
wipe = true

[[disk.devices]]
kind = "table"
id = "table"
disk = "disk"
table = "gpt"

[[disk.devices]]
kind = "partition"
id = "esp"
table = "table"
index = 1
role = "esp"
size = "512MiB"

[[disk.devices]]
kind = "partition"
id = "rootpart"
table = "table"
index = 2
role = "data"

[[disk.devices]]
kind = "filesystem"
id = "espfs"
device = "esp"
type = "vfat"
label = "ESP"

[[disk.devices]]
kind = "filesystem"
id = "rootfs"
device = "rootpart"
type = "ext4"
label = "gentoo"

[[disk.devices]]
kind = "mountpoint"
id = "mnt-root"
source = "rootfs"
path = "/"

[[disk.devices]]
kind = "mountpoint"
id = "mnt-esp"
source = "espfs"
path = "/efi"
options = ["umask=0077"]

# The desktop the plan names as the parity bar, with the Chinese environment
# switched on: fonts and an input method are separate choices from the locale.
[packages]
desktop = "gnome"
display_manager = "gdm"
applications = ["noto-cjk", "pipewire"]
