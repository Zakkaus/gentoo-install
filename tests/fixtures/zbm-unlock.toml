# Unlocking a ZFS pool over ssh from inside the ZFSBootMenu image.
#
# Split from `zfs-zbm` on 2026-08-17: that fixture carried both, so three
# runs which built the pool, the image and a machine that booted from it
# were still recorded as failures because the unlock did not answer on
# 2222. A fixture reporting on two features reports on neither.
config_version = 1

[system]
hostname = "zbmunlockbox"
timezone = "Asia/Taipei"
locales = ["en_US.UTF-8", "zh_TW.UTF-8"]
locale = "zh_TW.UTF-8"
init = "systemd"
root_password_hash = "$6$gentooinst$IR3GrdJ862XljQYDqocr4tKniIRDIT.jQNFzIrHE3U75H6B6YSWZoSYoVd5edSHpqaYBdiNfXHCoIPRVgb9lT/"
console_cjk = true
console_font = "8x16"

sshd = true
authorized_keys = ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB+85deBslaLOMFw71dx23wo7fFT76GVcEyQS9IdVvvT installer@example"]

[[system.users]]
name = "zakk"
sudo = true
password_hash = "$6$rounds=656000$fixedsaltforthetest$0"

[kernel.remote_unlock]
# ZFSBootMenu is what opens the pool, so the ssh server has to be in its image
# and not in the system initramfs built afterwards. No other fixture covers
# that combination.
enabled = true
port = 2222
address = "192.0.2.10/24"
gateway = "192.0.2.1"
interface = "eth0"

[portage]
profile = "default/linux/amd64/23.0/systemd"
makeopts = "-j8"

[portage.mirrors]
region = "global"

[portage.binhost]
official = true
community = "off"

[[portage.overlays]]
name = "gentoo-zh"
sync_uri = "https://mirrors.cernet.edu.cn/gentoo-zh.git"

[kernel]
source = "cjk-bin"

[bootloader]
kind = "zfsbootmenu"
firmware = "uefi"
kernel_params = ["console=ttyS0,115200", "quiet"]

[packages]
desktop = "console"

[disk]
root = "mnt-root"

[[disk.devices]]
kind = "existing"
id = "disk"
selector = "/dev/disk/by-id/virtio-target0"
wipe = true

[[disk.devices]]
kind = "table"
id = "table"
disk = "disk"
table = "gpt"

[[disk.devices]]
kind = "partition"
id = "esp"
table = "table"
index = 1
role = "esp"
size = "512MiB"

[[disk.devices]]
kind = "partition"
id = "poolpart"
table = "table"
index = 2
role = "data"

[[disk.devices]]
kind = "filesystem"
id = "espfs"
device = "esp"
type = "vfat"
label = "ESP"

[[disk.devices]]
kind = "zpool"
id = "pool"
vdevs = ["poolpart"]
name = "zpcala"
encrypted = true
passphrase_file = "/run/gentoo-install-keys/pool"

[[disk.devices]]
kind = "dataset"
id = "ds-root"
pool = "pool"
name = "ROOT/gentoo/root"

[[disk.devices]]
kind = "dataset"
id = "ds-home"
pool = "pool"
name = "ROOT/gentoo/home"

[[disk.devices]]
kind = "mountpoint"
id = "mnt-root"
source = "ds-root"
path = "/"

[[disk.devices]]
kind = "mountpoint"
id = "mnt-home"
source = "ds-home"
path = "/home"

[[disk.devices]]
kind = "mountpoint"
id = "mnt-esp"
source = "espfs"
path = "/efi"
options = ["umask=0077"]
