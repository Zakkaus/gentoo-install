# A table the operator edits rather than rewrites: partition 1 is already on
# the disk and is kept, and the installer adds partition 2 after it. The
# harness writes that table before the guest boots; `wipe` and `create` are
# both off, so nothing here may touch what partition 1 holds.
config_version = 1

[system]
hostname = "editbox"
timezone = "UTC"
locales = ["en_US.UTF-8"]
locale = "en_US.UTF-8"
init = "openrc"
root_password_hash = "$6$gentooinst$IR3GrdJ862XljQYDqocr4tKniIRDIT.jQNFzIrHE3U75H6B6YSWZoSYoVd5edSHpqaYBdiNfXHCoIPRVgb9lT/"

[portage]
profile = "default/linux/amd64/23.0"
makeopts = "-j4"

[portage.binhost]
official = true
community = "off"

[kernel]
source = "dist-bin"

[bootloader]
kind = "grub"
firmware = "bios"
kernel_params = ["console=ttyS0,115200"]

[disk]
root = "mnt-root"

[[disk.devices]]
kind = "existing"
id = "disk"
selector = "/dev/disk/by-id/virtio-target0"
wipe = false

[[disk.devices]]
kind = "table"
id = "table"
disk = "disk"
table = "mbr"
create = false

[[disk.devices]]
kind = "partition"
id = "rootpart"
table = "table"
index = 2
role = "data"
size = "12GiB"

[[disk.devices]]
kind = "filesystem"
id = "rootfs"
device = "rootpart"
type = "ext4"
label = "root"

[[disk.devices]]
kind = "mountpoint"
id = "mnt-root"
source = "rootfs"
path = "/"
