# What the memory environment is asked to install once it comes up. Plain
# ext4 on UEFI: this fixture exists to verify the arming and the delivery,
# and a layout with anything else in it would fail for reasons that belong to
# another fixture.
#
# The hostname is not the cloud image's, so a console that answers to it is
# the installed system rather than the machine that was replaced.
#
# The root hash below is `install`, produced by `openssl passwd -6`.
config_version = 1

[system]
hostname = "rambox"
timezone = "UTC"
locales = ["en_US.UTF-8"]
locale = "en_US.UTF-8"
init = "systemd"
sshd = true
root_password_hash = "$6$gentooinst$IR3GrdJ862XljQYDqocr4tKniIRDIT.jQNFzIrHE3U75H6B6YSWZoSYoVd5edSHpqaYBdiNfXHCoIPRVgb9lT/"

[portage]
profile = "default/linux/amd64/23.0/systemd"
makeopts = "-j4"

[portage.mirrors]
region = "global"

[portage.binhost]
official = true
community = "off"

[kernel]
source = "dist-bin"

[bootloader]
kind = "grub"
firmware = "uefi"
kernel_params = ["console=ttyS0,115200"]

[disk]
root = "mnt-root"

[[disk.devices]]
kind = "existing"
id = "disk"
selector = "/dev/disk/by-id/virtio-target0"
wipe = true

[[disk.devices]]
kind = "table"
id = "table"
disk = "disk"
table = "gpt"

[[disk.devices]]
kind = "partition"
id = "esp"
table = "table"
index = 1
role = "esp"
size = "512MiB"

[[disk.devices]]
kind = "partition"
id = "rootpart"
table = "table"
index = 2
role = "data"

[[disk.devices]]
kind = "filesystem"
id = "espfs"
device = "esp"
type = "vfat"
label = "ESP"

[[disk.devices]]
kind = "filesystem"
id = "rootfs"
device = "rootpart"
type = "ext4"
label = "gentoo"

[[disk.devices]]
kind = "mountpoint"
id = "mnt-root"
source = "rootfs"
path = "/"

[[disk.devices]]
kind = "mountpoint"
id = "mnt-esp"
source = "espfs"
path = "/efi"
options = ["umask=0077"]
