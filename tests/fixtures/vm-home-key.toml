# The same sudo user as `vm-user-key`, on a layout where `/home` is a mount of
# its own. The pair is the measurement: that one puts `/home` in the root
# filesystem and its key survives, and the two ZFSBootMenu fixtures put it on a
# separate dataset and lose it. This holds the separate mount and drops ZFS.
config_version = 1

[system]
hostname = "homekeybox"
timezone = "Asia/Taipei"
locales = ["en_US.UTF-8", "zh_TW.UTF-8"]
locale = "zh_TW.UTF-8"
init = "systemd"
root_password_hash = "$6$gentooinst$IR3GrdJ862XljQYDqocr4tKniIRDIT.jQNFzIrHE3U75H6B6YSWZoSYoVd5edSHpqaYBdiNfXHCoIPRVgb9lT/"
sshd = true
authorized_keys = ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB+85deBslaLOMFw71dx23wo7fFT76GVcEyQS9IdVvvT installer@example"]

[[system.users]]
name = "zakk"
sudo = true
password_hash = "$6$rounds=656000$fixedsaltforthetest$0"

[portage]
profile = "default/linux/amd64/23.0/systemd"
makeopts = "-j4"

[portage.binhost]
official = true
community = "off"

[kernel]
source = "dist-bin"

[bootloader]
kind = "grub"
firmware = "uefi"
kernel_params = ["console=ttyS0,115200"]

[disk]
root = "mnt-root"

[[disk.devices]]
kind = "existing"
id = "disk"
selector = "/dev/disk/by-id/virtio-target0"
wipe = true

[[disk.devices]]
kind = "table"
id = "table"
disk = "disk"
table = "gpt"

[[disk.devices]]
kind = "partition"
id = "esp"
table = "table"
index = 1
role = "esp"
size = "512MiB"

[[disk.devices]]
kind = "partition"
id = "cryptroot"
table = "table"
index = 2
role = "data"

[[disk.devices]]
kind = "filesystem"
id = "espfs"
device = "esp"
type = "vfat"
label = "ESP"

[[disk.devices]]
kind = "filesystem"
id = "rootfs"
device = "cryptroot"
type = "btrfs"

[[disk.devices]]
kind = "subvolume"
id = "sub-root"
filesystem = "rootfs"
name = "@"

[[disk.devices]]
kind = "subvolume"
id = "sub-home"
filesystem = "rootfs"
name = "@home"

[[disk.devices]]
kind = "mountpoint"
id = "mnt-root"
source = "sub-root"
path = "/"
options = ["compress=zstd:1"]

[[disk.devices]]
kind = "mountpoint"
id = "mnt-home"
source = "sub-home"
path = "/home"
options = ["compress=zstd:1"]

[[disk.devices]]
kind = "mountpoint"
id = "mnt-esp"
source = "espfs"
path = "/efi"
options = ["umask=0077"]
