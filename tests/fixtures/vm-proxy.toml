# Every fetch goes through a SOCKS5 proxy that demands a password. `vm-proxy-dead`
# proves the failure direction; nothing had ever proved that an install completes
# when the proxy works, which is what an operator on an intranet actually needs.
#
# `10.0.2.2` is the workstation as qemu's user-mode network presents it, so this
# fixture runs under `tests/vm/run.py` and not on the cluster.
#
# The root hash below is `install`, produced by `openssl passwd -6`.
config_version = 1

[proxy]
url = "socks5h://installer:secret@10.0.2.2:1080"
bypass = ["localhost", "127.0.0.1"]

[system]
hostname = "proxybox"
timezone = "Asia/Taipei"
locales = ["en_US.UTF-8", "zh_TW.UTF-8"]
locale = "zh_TW.UTF-8"
init = "systemd"
root_password_hash = "$6$gentooinst$IR3GrdJ862XljQYDqocr4tKniIRDIT.jQNFzIrHE3U75H6B6YSWZoSYoVd5edSHpqaYBdiNfXHCoIPRVgb9lT/"

[portage]
profile = "default/linux/amd64/23.0/systemd"
makeopts = "-j4"

[portage.binhost]
official = true
community = "off"

[kernel]
source = "dist-bin"

[bootloader]
kind = "grub"
firmware = "uefi"
kernel_params = ["console=ttyS0,115200"]

[disk]
root = "mnt-root"

[[disk.devices]]
kind = "existing"
id = "disk"
selector = "/dev/disk/by-id/virtio-target0"
wipe = true

[[disk.devices]]
kind = "table"
id = "table"
disk = "disk"
table = "gpt"

[[disk.devices]]
kind = "partition"
id = "esp"
table = "table"
index = 1
role = "esp"
size = "512MiB"

[[disk.devices]]
kind = "partition"
id = "cryptroot"
table = "table"
index = 2
role = "data"

[[disk.devices]]
kind = "filesystem"
id = "espfs"
device = "esp"
type = "vfat"
label = "ESP"

[[disk.devices]]
kind = "filesystem"
id = "rootfs"
device = "cryptroot"
type = "btrfs"

[[disk.devices]]
kind = "subvolume"
id = "sub-root"
filesystem = "rootfs"
name = "@"

[[disk.devices]]
kind = "subvolume"
id = "sub-home"
filesystem = "rootfs"
name = "@home"

[[disk.devices]]
kind = "mountpoint"
id = "mnt-root"
source = "sub-root"
path = "/"
options = ["compress=zstd:1"]

[[disk.devices]]
kind = "mountpoint"
id = "mnt-home"
source = "sub-home"
path = "/home"
options = ["compress=zstd:1"]

[[disk.devices]]
kind = "mountpoint"
id = "mnt-esp"
source = "espfs"
path = "/efi"
options = ["umask=0077"]
