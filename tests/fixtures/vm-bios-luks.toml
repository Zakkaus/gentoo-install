# BIOS with an encrypted root. GRUB has to open the container itself to
# read /boot, which is what GRUB_ENABLE_CRYPTODISK is for, and no fixture
# reached that on an MBR disk: btrfs-luks is UEFI and vm-bios is plain.
#
# The root hash below is `install`, produced by `openssl passwd -6`.
config_version = 1

[system]
hostname = "biosluks"
timezone = "UTC"
locales = ["en_US.UTF-8"]
locale = "en_US.UTF-8"
init = "openrc"
root_password_hash = "$6$gentooinst$IR3GrdJ862XljQYDqocr4tKniIRDIT.jQNFzIrHE3U75H6B6YSWZoSYoVd5edSHpqaYBdiNfXHCoIPRVgb9lT/"

[portage]
profile = "default/linux/amd64/23.0"
makeopts = "-j4"

[portage.binhost]
official = true
community = "off"

[kernel]
source = "dist-bin"

[bootloader]
kind = "grub"
firmware = "bios"
kernel_params = ["console=ttyS0,115200"]

[disk]
root = "mnt-root"

[[disk.devices]]
kind = "existing"
id = "disk"
selector = "/dev/disk/by-id/virtio-target0"
wipe = true

[[disk.devices]]
kind = "table"
id = "table"
disk = "disk"
table = "mbr"

[[disk.devices]]
kind = "partition"
id = "swappart"
table = "table"
index = 1
role = "swap"
size = "2GiB"

[[disk.devices]]
kind = "partition"
id = "rootpart"
table = "table"
index = 2
role = "data"

[[disk.devices]]
kind = "swap"
id = "swap"
device = "swappart"

[[disk.devices]]
kind = "luks"
id = "root-luks"
backing = "rootpart"
name = "root"
passphrase_file = "/run/gentoo-install-keys/root"

[[disk.devices]]
kind = "filesystem"
id = "rootfs"
device = "root-luks"
type = "ext4"
label = "root"

[[disk.devices]]
kind = "mountpoint"
id = "mnt-root"
source = "rootfs"
path = "/"
