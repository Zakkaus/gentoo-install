# The patched kernel: `sys-kernel/gentoo-cjk-kernel` from gentoo-zh, which is a
# dist-kernel and so builds and installs itself. It is ~amd64, and its cjk USE
# flag is what merges the patch's own config.
config_version = 1

[system]
hostname = "srcbox"
timezone = "UTC"
locales = ["en_US.UTF-8"]
locale = "en_US.UTF-8"
init = "systemd"
console_cjk = true
console_font = "8x16"
root_password_hash = "$6$gentooinst$IR3GrdJ862XljQYDqocr4tKniIRDIT.jQNFzIrHE3U75H6B6YSWZoSYoVd5edSHpqaYBdiNfXHCoIPRVgb9lT/"

[portage]
profile = "default/linux/amd64/23.0/systemd"
makeopts = "-j4"

[[portage.overlays]]
name = "gentoo-zh"
sync_uri = "https://github.com/gentoo-zh/overlay.git"

[portage.binhost]
official = true
community = "off"

[kernel]
source = "cjk"

[bootloader]
kind = "grub"
firmware = "uefi"
kernel_params = ["console=ttyS0,115200"]

[disk]
root = "mnt-root"

[[disk.devices]]
kind = "existing"
id = "disk"
selector = "/dev/disk/by-id/virtio-target0"
wipe = true

[[disk.devices]]
kind = "table"
id = "table"
disk = "disk"
table = "gpt"

[[disk.devices]]
kind = "partition"
id = "esp"
table = "table"
index = 1
role = "esp"
size = "512MiB"

[[disk.devices]]
kind = "partition"
id = "rootpart"
table = "table"
index = 2
role = "data"

[[disk.devices]]
kind = "filesystem"
id = "espfs"
device = "esp"
type = "vfat"
label = "ESP"

[[disk.devices]]
kind = "filesystem"
id = "rootfs"
device = "rootpart"
type = "ext4"
label = "gentoo"

[[disk.devices]]
kind = "mountpoint"
id = "mnt-root"
source = "rootfs"
path = "/"

[[disk.devices]]
kind = "mountpoint"
id = "mnt-esp"
source = "espfs"
path = "/efi"
options = ["umask=0077"]
