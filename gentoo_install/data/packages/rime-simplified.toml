# The simplified Chinese schema, from the main tree. gentoo-zh packages
# rime-ice, but only as a 9999 live ebuild with no keywords, which
# `*/*::gentoo-zh ~amd64` cannot unmask and which would build from git HEAD at
# install time.
# `app-i18n/rime-data` installs data files and nothing else, so a schema
# chosen on its own left fcitx naming an addon that was not on disk and
# falling back to `keyboard-us`. The engine comes with it.
packages = ["app-i18n/fcitx-rime", "app-i18n/rime-data"]
label = "Simplified Pinyin (Rime)"
package_use = ["app-i18n/rime-data extra"]
input_framework = "fcitx"
input_method = "rime"
input_language = "Chinese"
schemas = ["pinyin_simp"]
