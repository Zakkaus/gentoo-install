# The proprietary driver. NVIDIA-2025 is in @BINARY-REDISTRIBUTABLE, so the
# default @FREE refuses it and the emerge dies an hour into the install.
#
# `dist-kernel` is off by default in linux-mod-r1's IUSE. Without it the
# module is built once and never rebuilt, so the next kernel upgrade leaves
# the machine at a console with no driver.
#
# Nothing else is written. The ebuild's own /etc/modprobe.d/nvidia.conf
# blacklists nouveau and adds itself to dracut's install_items, and since
# 595.84 it carries no modeset line at all: "nvidia-drm.modeset=1 was removed
# from nvidia.conf because it is now default enabled regardless". A drop-in
# of ours would set what the driver already defaults to, and no kernel
# parameter is needed either.
packages = ["x11-drivers/nvidia-drivers"]
package_use = ["x11-drivers/nvidia-drivers dist-kernel"]
video_cards = ["nvidia"]
accept_license = ["@BINARY-REDISTRIBUTABLE"]
