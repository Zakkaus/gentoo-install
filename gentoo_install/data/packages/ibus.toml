# The other input method framework. Offered because a desktop that already
# expects it should not be made to learn fcitx, and because GNOME drives it
# from its own settings rather than from a launcher.
#
# It cannot be installed beside fcitx: both claim the same toolkit variables,
# so `packages.framework_conflict()` refuses the pair.
packages = ["app-i18n/ibus"]
input_framework = "ibus"
