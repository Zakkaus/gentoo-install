# Interface strings, Japanese. The key is the English source.
[strings]
"The selected disk is rewritten as the install target." = "選択したディスクはインストール先として書き換えられます。"
"Automatic layout replaces the partition table; manual layout controls each partition." = "自動配置はパーティションテーブルを置き換え、手動配置では各パーティションを個別に設定します。"
"This choice sets the root filesystem and partition graph." = "ルートファイルシステムとパーティション構成が決まります。"
"The bootloader determines how the ZFS root is found at startup." = "ブートローダーで起動時に ZFS ルートを見つける方法が決まります。"
"This selects the service manager and its matching profile." = "サービスマネージャーと対応する profile を選びます。"
"These sources provide the Gentoo tree, distfiles, overlays, and binary packages." = "これらのソースは Gentoo ツリー、distfiles、overlay、バイナリパッケージを提供します。"
"Binary packages reduce compilation; source builds remain the fallback." = "バイナリパッケージでコンパイルが減り、ソースビルドはフォールバックに残ります。"
"The bootloader installs the files firmware uses to start the kernel." = "ブートローダーはファームウェアがカーネルを起動するファイルをインストールします。"
"This service records messages from OpenRC after boot." = "このサービスは起動後の OpenRC のメッセージを記録します。"
"The keyword policy controls which versions Portage may accept." = "キーワードポリシーで Portage が受け入れるバージョンを制御します。"
"The kernel provides the boot environment and CJK console support." = "カーネルが起動環境と CJK コンソール対応を提供します。"
"The desktop selects its profile and proposes login and network services." = "デスクトップは profile を選び、ログインサービスとネットワークサービスを提案します。"
"The drivers set VIDEO_CARDS and install required firmware or packages." = "ドライバーは VIDEO_CARDS を設定し、必要なファームウェアやパッケージをインストールします。"
"These packages supplement the desktop selection." = "これらのパッケージはデスクトップの選択を補います。"
"The installed system uses this zone for local time and schedules." = "インストールしたシステムはこのゾーンを現地時刻とスケジュールに使います。"
"A swap partition relieves memory pressure and can support hibernation." = "スワップパーティションはメモリ不足を緩和し、休止状態にも使えます。"
"zram creates compressed swap in memory without disk space." = "zram はディスク領域を使わず、メモリ内に圧縮スワップを作ります。"
"Portage builds in memory; its contents disappear after reboot." = "Portage はこのメモリ領域でビルドし、再起動すると内容は消えます。"
"Loading a saved file replaces the current answers." = "保存したファイルを読み込むと現在の回答が置き換わります。"
"The table format controls how firmware and the kernel identify partitions." = "テーブル形式でファームウェアとカーネルがパーティションを識別します。"
"The console font controls glyph sizes before the desktop starts." = "コンソールフォントでデスクトップ起動前の字形サイズを制御します。"
"These flags select the instruction set used to compile packages." = "これらのフラグでパッケージのコンパイルに使う命令セットを選びます。"
"This selects the service that brings interfaces up." = "インターフェースを起動するサービスを選びます。"
"This installs a packet filter but does not write its policy." = "パケットフィルターをインストールしますが、ポリシーは書きません。"
"The loaded layout cannot be edited here. Opening this editor replaces it with what the disk holds now." = "読み込んだレイアウトはここでは編集できません。このエディタを開くと、ディスクの現在の内容で置き換わります。"
"This editor controls which partitions are kept, formatted, mounted, or erased." = "このエディターでパーティションを保持、フォーマット、マウント、消去するか決めます。"
