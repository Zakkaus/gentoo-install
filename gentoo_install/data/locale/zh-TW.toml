# 介面字串，正體中文。鍵是英文原文，查不到就退回原文。
[strings]
"The selected disk is rewritten as the install target." = "選定的磁碟會重新寫入，作為安裝目標。"
"Automatic layout replaces the partition table; manual layout controls each partition." = "自動配置會取代分割表；手動配置控制每個分割區。"
"This choice sets the root filesystem and partition graph." = "此選擇決定根檔案系統與分割配置。"
"The bootloader determines how the ZFS root is found at startup." = "引導程式決定系統啟動時如何找到 ZFS 根檔案系統。"
"This selects the service manager and its matching profile." = "此選擇決定服務管理器與相符的 profile。"
"These sources provide the Gentoo tree, distfiles, overlays, and binary packages." = "這些來源提供 Gentoo 樹、distfiles、overlay 與二進位套件。"
"Binary packages reduce compilation; source builds remain the fallback." = "二進位套件可減少編譯；原始碼建置仍是後備路徑。"
"The bootloader installs the files firmware uses to start the kernel." = "引導程式會安裝韌體用來啟動核心的檔案。"
"This service records messages from OpenRC after boot." = "此服務記錄 OpenRC 啟動後的訊息。"
"The keyword policy controls which versions Portage may accept." = "關鍵字政策控制 Portage 可以接受哪些版本。"
"The kernel provides the boot environment and CJK console support." = "核心提供開機環境與 CJK 主控台支援。"
"The desktop selects its profile and proposes login and network services." = "桌面會選擇 profile，並提出登入與網路服務。"
"The drivers set VIDEO_CARDS and install required firmware or packages." = "驅動程式會設定 VIDEO_CARDS，並安裝所需的韌體或套件。"
"These packages supplement the desktop selection." = "這些套件會補充桌面選擇。"
"The installed system uses this zone for local time and schedules." = "已安裝的系統會使用此時區表示本地時間並執行排程。"
"A swap partition relieves memory pressure and can support hibernation." = "Swap 分割區可緩解記憶體壓力，也可以支援休眠。"
"zram creates compressed swap in memory without disk space." = "zram 在記憶體中建立壓縮 swap，不使用磁碟空間。"
"Portage builds in memory; its contents disappear after reboot." = "Portage 在記憶體中建置；重新開機後內容會消失。"
"Loading a saved file replaces the current answers." = "載入已儲存的檔案會取代目前設定。"
"The table format controls how firmware and the kernel identify partitions." = "分割表格式控制韌體與核心如何識別分割區。"
"The console font controls glyph sizes before the desktop starts." = "主控台字型控制桌面啟動前的字元大小。"
"These flags select the instruction set used to compile packages." = "這些旗標選擇編譯套件時使用的指令集。"
"This selects the service that brings interfaces up." = "此選擇決定啟用網路介面的服務。"
"This installs a packet filter but does not write its policy." = "此選擇會安裝封包過濾套件，但不會寫入政策。"
