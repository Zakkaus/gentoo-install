# Interface strings, Korean. The key is the English source.
[strings]
"The selected disk is rewritten as the install target." = "선택한 디스크를 설치 대상으로 다시 작성합니다."
"Automatic layout replaces the partition table; manual layout controls each partition." = "자동 배치는 테이블을 교체하고 수동 배치는 각 파티션을 관리합니다."
"This choice sets the root filesystem and partition graph." = "루트 파일 시스템과 파티션 구성이 정해집니다."
"The bootloader determines how the ZFS root is found at startup." = "부트로더가 시작할 때 ZFS 루트를 찾는 방법을 정합니다."
"This selects the service manager and its matching profile." = "서비스 관리자와 일치하는 profile을 선택합니다."
"These sources provide the Gentoo tree, distfiles, overlays, and binary packages." = "이 소스가 Gentoo 트리, distfiles, overlay 및 바이너리 패키지를 제공합니다."
"Binary packages reduce compilation; source builds remain the fallback." = "바이너리 패키지는 컴파일을 줄이고 소스 빌드는 대체 경로로 남습니다."
"The bootloader installs the files firmware uses to start the kernel." = "부트로더가 펌웨어가 커널을 시작하는 데 사용하는 파일을 설치합니다."
"This service records messages from OpenRC after boot." = "이 서비스가 부팅 후 OpenRC 메시지를 기록합니다."
"The keyword policy controls which versions Portage may accept." = "키워드 정책이 Portage가 허용할 버전을 제어합니다."
"The kernel provides the boot environment and CJK console support." = "커널이 부팅 환경과 CJK 콘솔 지원을 제공합니다."
"The desktop selects its profile and proposes login and network services." = "데스크톱이 profile을 선택하고 로그인 및 네트워크 서비스를 제안합니다."
"The drivers set VIDEO_CARDS and install required firmware or packages." = "드라이버가 VIDEO_CARDS를 설정하고 필요한 펌웨어나 패키지를 설치합니다."
"These packages supplement the desktop selection." = "이 패키지들이 데스크톱 선택을 보완합니다."
"The installed system uses this zone for local time and schedules." = "설치한 시스템이 이 시간대를 현지 시각과 일정에 사용합니다."
"A swap partition relieves memory pressure and can support hibernation." = "스왑 파티션이 메모리 부족을 완화하고 최대 절전 모드를 지원할 수 있습니다."
"zram creates compressed swap in memory without disk space." = "zram이 디스크 공간 없이 메모리에 압축 스왑을 만듭니다."
"Portage builds in memory; its contents disappear after reboot." = "Portage가 이 메모리 공간에서 빌드하므로 재부팅하면 내용이 사라집니다."
"Loading a saved file replaces the current answers." = "저장한 파일을 불러오면 현재 답변을 대체합니다."
"The table format controls how firmware and the kernel identify partitions." = "테이블 형식이 펌웨어와 커널이 파티션을 식별하는 방법을 제어합니다."
"The console font controls glyph sizes before the desktop starts." = "콘솔 글꼴이 데스크톱 시작 전 글리프 크기를 제어합니다."
"These flags select the instruction set used to compile packages." = "이 플래그가 패키지 컴파일에 사용할 명령어 집합을 선택합니다."
"This selects the service that brings interfaces up." = "네트워크 인터페이스를 활성화할 서비스를 선택합니다."
"This installs a packet filter but does not write its policy." = "패킷 필터를 설치하지만 정책은 작성하지 않습니다."
"This editor controls which partitions are kept, formatted, mounted, or erased." = "이 편집기에서 파티션을 유지, 포맷, 마운트 또는 삭제할지 정합니다."
