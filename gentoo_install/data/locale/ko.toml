"this machine has too little memory to build in it" = "이 기기는 메모리가 부족해 빌드할 수 없습니다"
"Send the configuration to the pastebin" = "설정을 paste 로 보내기"
"GRUB reads only some ZFS feature flags, so a pool that enables a newer one stops booting" = "GRUB 는 일부 ZFS 기능 플래그만 읽으므로 최신 기능을 켠 풀은 부팅되지 않습니다"
"ZFSBootMenu is an EFI executable" = "ZFSBootMenu 는 EFI 실행 파일입니다"
"use ZFS native encryption instead" = "ZFS 네이티브 암호화를 사용하세요"
"it imports a pool and boots a dataset from it, so it needs ZFS" = "풀을 가져와 데이터셋에서 부팅하므로 ZFS 가 필요합니다"
"an EFI executable has to live on a vfat esp mounted in the target" = "EFI 실행 파일은 대상에 마운트된 vfat esp 에 있어야 합니다"
"systemd-boot has no BIOS implementation" = "systemd-boot 에는 BIOS 구현이 없습니다"
"it reads only the esp, so the kernel has to be on it: mount the esp at /boot" = "esp 만 읽으므로 커널이 esp 에 있어야 합니다. esp 를 /boot 에 마운트하세요"
"firmware reads a member as a plain vfat partition, and only 0.90 and 1.0 keep the superblock at the end of the member" = "펌웨어는 멤버를 일반 vfat 파티션으로 읽으며 superblock 을 끝에 두는 것은 0.90 과 1.0 뿐입니다"
"GRUB stage 1.5 needs somewhere to live" = "GRUB stage 1.5 를 둘 공간이 필요합니다"
"cjktty patches the kernel VT layer, which no official kernel carries; sys-kernel/gentoo-cjk-kernel is the one that does" = "cjktty 는 커널 VT 계층을 패치하며 공식 커널에는 없고 sys-kernel/gentoo-cjk-kernel 에만 있습니다"
"dracut-crypt-ssh authorises /root/.ssh/authorized_keys, so with none the initramfs runs an ssh daemon nobody can log into" = "dracut-crypt-ssh 는 /root/.ssh/authorized_keys 를 사용하므로 키가 없으면 initramfs 는 아무도 로그인할 수 없는 ssh 를 실행합니다"
"there is no passphrase prompt to reach: the root is not encrypted" = "도달할 암호 구절 입력이 없습니다. 루트가 암호화되지 않았습니다"
"sys-kernel/gentoo-cjk-kernel is in that overlay and in no other repository, so the emerge fails once the disks have been partitioned" = "sys-kernel/gentoo-cjk-kernel 은 그 overlay 에만 있어 디스크를 나눈 뒤에 emerge 가 실패합니다"
"the cjk kernel builds CONFIG_FONT_CJK_16x16 alone, which pairs with the 8x16 font, because the 32x32 font the patch ships is empty" = "cjk 커널은 CONFIG_FONT_CJK_16x16 만 빌드하며 8x16 글꼴과 짝을 이룹니다. 패치가 제공하는 32x32 글꼴이 비어 있기 때문입니다"
"sys-boot/zfsbootmenu is in that overlay and in no other repository, so the emerge fails once the disks have already been partitioned" = "sys-boot/zfsbootmenu 은 그 overlay 에만 있어 디스크를 나눈 뒤에 emerge 가 실패합니다"
"the key its packages are signed with comes from that overlay, and without it nothing from the host verifies" = "패키지 서명 키가 그 overlay 에서 오므로 없으면 호스트의 어떤 것도 검증되지 않습니다"
"firmware cannot open a container to read the esp" = "펌웨어는 esp 를 읽을 때 컨테이너를 열 수 없습니다"
"firmware reads the esp itself and cannot open a LUKS container, so an encrypted one never boots" = "펌웨어는 esp 를 직접 읽으며 LUKS 컨테이너를 열 수 없으므로 암호화된 esp 는 부팅되지 않습니다"
"Run once at first boot" = "첫 부팅에 한 번 실행"
