"dracut-crypt-ssh authorises /root/.ssh/authorized_keys, so with none the initramfs runs an ssh daemon nobody can log into" = "dracut-crypt-ssh 使用 /root/.ssh/authorized_keys 进行授权；没有公钥时，任何人都无法登录 initramfs 中的 SSH 服务。"
"there is no passphrase prompt to reach: the root is not encrypted" = "根文件系统未加密，因此不存在可供远程解锁的密码短语提示"
"sys-kernel/gentoo-cjk-kernel is in that overlay and in no other repository, so the emerge fails once the disks have been partitioned" = "sys-kernel/gentoo-cjk-kernel 只在那个 overlay 里，别的仓库都没有，所以 emerge 会在磁盘分区完之后才失败"
"the cjk kernel builds CONFIG_FONT_CJK_16x16 alone, which pairs with the 8x16 font, because the 32x32 font the patch ships is empty" = "cjk 内核仅启用 CONFIG_FONT_CJK_16x16；该选项对应 8x16 字体，因为补丁提供的 32x32 字体为空。"
"sys-boot/zfsbootmenu is in that overlay and in no other repository, so the emerge fails once the disks have already been partitioned" = "sys-boot/zfsbootmenu 只在那个 overlay 里，别的仓库都没有，所以 emerge 会在磁盘分区完之后才失败"
"the key its packages are signed with comes from that overlay, and without it nothing from the host verifies" = "签名密钥来自该 overlay；缺少该密钥时，binhost 提供的软件包均无法通过验证。"
"firmware cannot open a container to read the esp" = "固件读 esp 时打不开加密容器"
"firmware reads the esp itself and cannot open a LUKS container, so an encrypted one never boots" = "固件无法打开 LUKS 容器，因此使用加密 esp 的系统无法启动。"
