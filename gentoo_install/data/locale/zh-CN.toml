"How packages are built: parallel jobs, optimisation flags and keyword policy." = "软件包的构建方式：并行任务数、优化旗标与关键字政策。"
"The password for the root account of the installed system." = "安装后系统 root 账户的密码。"
"An account created beside root, and the groups it belongs to." = "除 root 之外建立的账户，以及它所属的用户组。"
"Which kernel package is merged, and the console font it is built with." = "要合并的内核软件包，以及编入的控制台字体。"
"What the firmware starts, and the parameters passed to the kernel." = "固件启动的对象，以及传给内核的参数。"
"The desktop, the display manager that starts it, and the graphics drivers." = "桌面环境、启动它的显示管理器，以及显示驱动程序。"
"Applications merged after the system is installed." = "系统安装完成后合并的应用程序。"
"Any further package atoms to merge, given by name." = "以名称指定、额外要合并的软件包 atom。"
"How the installed system configures its network at startup." = "安装后系统启动时设置网络的方式。"
"Whether the installed system starts an SSH server, and what it accepts." = "安装后系统是否启动 SSH 服务，以及接受哪些登录方式。"
"Agreement that the selected disk is erased, which cannot be undone." = "同意清除选定的磁盘，这个动作无法撤销。"
"The other modes are not available on this machine." = "本机没有其他可用的模式。"
