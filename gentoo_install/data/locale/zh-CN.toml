# 界面字符串，简体中文。键是英文原文，查不到就退回原文。
[strings]
"The selected disk is rewritten as the install target." = "选定的磁盘会重新写入，作为安装目标。"
"Automatic layout replaces the partition table; manual layout controls each partition." = "自动布局会替换分区表；手动布局控制每个分区。"
"This choice sets the root filesystem and partition graph." = "此选择决定根文件系统和分区布局。"
"The bootloader determines how the ZFS root is found at startup." = "引导加载器决定系统启动时如何找到 ZFS 根文件系统。"
"This selects the service manager and its matching profile." = "此选择决定服务管理器和匹配的 profile。"
"These sources provide the Gentoo tree, distfiles, overlays, and binary packages." = "这些来源提供 Gentoo 树、distfiles、overlay 和二进制软件包。"
"Binary packages reduce compilation; source builds remain the fallback." = "二进制软件包可以减少编译；源代码构建仍是备用路径。"
"The bootloader installs the files firmware uses to start the kernel." = "引导加载器会安装固件用来启动内核的文件。"
"This service records messages from OpenRC after boot." = "此服务记录 OpenRC 启动后的消息。"
"The keyword policy controls which versions Portage may accept." = "关键字策略控制 Portage 可以接受哪些版本。"
"The kernel provides the boot environment and CJK console support." = "内核提供启动环境和 CJK 控制台支持。"
"The desktop selects its profile and proposes login and network services." = "桌面会选择 profile，并提出登录和网络服务。"
"The drivers set VIDEO_CARDS and install required firmware or packages." = "驱动程序会设置 VIDEO_CARDS，并安装所需的固件或软件包。"
"These packages supplement the desktop selection." = "这些软件包会补充桌面选择。"
"The installed system uses this zone for local time and schedules." = "已安装的系统会使用此时区表示本地时间并执行计划。"
"A swap partition relieves memory pressure and can support hibernation." = "交换分区可以缓解内存压力，也可以支持休眠。"
"zram creates compressed swap in memory without disk space." = "zram 在内存中创建压缩交换，不占用磁盘空间。"
