"Narrow a list to the rows holding what is typed next" = "把列表缩小到含有接着输入的文字的那些行"
"This choice decides whether a new system is built or this one is replaced." = "此选择决定要建立新系统，或是取代目前运行中的系统。"
"This medium carries no installed system to replace." = "这个安装介质上没有可以取代的已安装系统。"
"The running system cannot be read on this machine." = "这台机器上读不出运行中的系统。"
"This installer cannot describe the filesystem the running system boots from." = "安装程序无法描述运行中的系统开机所在的文件系统。"
