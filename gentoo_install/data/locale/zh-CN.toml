"The running system was not read." = "尚未读取运行中的系统。"
"The medium was not asked whether it runs from memory." = "尚未确认这个安装介质是否从内存运行。"
"This language needs a cjktty kernel or a CJK console font." = "这个语言需要 cjktty 内核，或是控制台上有 CJK 字体。"
"Press enter to edit." = "按 enter 编辑"
"How this machine booted, which decides the bootloader the install can use." = "这台机器的开机方式，决定安装可以使用的引导加载器。"
"The proxy every fetch goes through, for a network with no direct connection." = "每一次抓取经过的代理，用于没有直连的网络。"
"The console keyboard layout of the installed system." = "安装后系统的控制台键盘布局。"
"The system locale, the fonts it needs, and the input method for typing CJK." = "系统语系、需要的字体，以及输入 CJK 的输入法。"
"The zone the installed system keeps local time and schedules in." = "安装后系统计算本地时间与排程所用的时区。"
"Where the tree, distfiles, overlays and binary packages are fetched from." = "Gentoo 树、distfiles、overlay 与二进制软件包的抓取来源。"
"Whether a new system is built on a disk or the running system is replaced." = "在磁盘上建立新系统，或取代目前运行中的系统。"
